# Self-hosted RAG stack: Weaviate + local embedding model + local LLM.
# Nothing leaves the machine: no external AI APIs are called.
#
#   pnpm infra:up      # start everything (first run downloads ~3 GB of images/models)
#   pnpm infra:down    # stop (data persists in named volumes)

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.5
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080"   # REST
      - "50051:50051" # gRPC (used by the TS client for queries/batching)
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      # MVP only: no auth on a localhost-bound instance. Enable API-key/OIDC before any shared deployment.
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: text2vec-transformers,generative-ollama
      TRANSFORMERS_INFERENCE_API: http://t2v-transformers:8080
      DISABLE_TELEMETRY: "true"
    depends_on:
      - t2v-transformers
      - ollama

  # Embedding model served for Weaviate's text2vec-transformers module.
  # Multilingual (50+ languages incl. Hindi + English), 384-dim, CPU friendly.
  # Higher quality / heavier alternative: ...:intfloat-multilingual-e5-large-1.13.3
  t2v-transformers:
    image: cr.weaviate.io/semitechnologies/transformers-inference:sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2-1.13.3
    environment:
      ENABLE_CUDA: "0"

  # Local LLM for generative-ollama (the "G" in RAG).
  ollama:
    image: ollama/ollama:0.40.16
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot: pulls the LLM into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:0.40.16
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-llama3.2}"]
    restart: "no"

volumes:
  weaviate_data:
  ollama_data:
