# Self-hosted RAG stack in Docker: Weaviate + Ollama (embeddings + LLM).
# Nothing leaves the machine: no external AI APIs are called.
#
# Low on RAM/disk or no Docker? Use the native setup instead (see README):
#   pnpm infra:native   (Weaviate binary)  +  brew install ollama
#
# With this compose file, set in api/.env:
#   OLLAMA_ENDPOINT=http://ollama:11434       (used by Weaviate, inside the docker network)
#   OLLAMA_API_ENDPOINT=http://localhost:11434 (used by the API on the host for chat)
#
#   docker compose up -d
#   docker compose logs -f ollama-pull   # wait for the model downloads (~1.5 GB)

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.5
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080"   # REST
      - "50051:50051" # gRPC (used by the TS client for queries/batching)
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      # MVP only: no auth. Enable API-key/OIDC before any shared deployment.
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: text2vec-ollama,generative-ollama
      # Local LLMs on CPU can exceed the 50s default.
      MODULES_CLIENT_TIMEOUT: 180s
      DISABLE_TELEMETRY: "true"
    depends_on:
      - ollama

  # Serves both models: embeddings (text2vec-ollama) and the LLM (generative-ollama).
  ollama:
    image: ollama/ollama:0.40.16
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot: pulls the models into the ollama volume, then exits.
  #   paraphrase-multilingual  562 MB  multilingual embeddings (Hindi + English)
  #   qwen2.5:1.5b             986 MB  smallest model that answered our test questions correctly
  ollama-pull:
    image: ollama/ollama:0.40.16
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - sleep 3 && ollama pull ${OLLAMA_EMBED_MODEL:-paraphrase-multilingual} && ollama pull ${OLLAMA_MODEL:-qwen2.5:1.5b}
    restart: "no"

volumes:
  weaviate_data:
  ollama_data:
